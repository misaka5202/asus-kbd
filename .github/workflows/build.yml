name: Build asus-kbd

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build asus-kbd
        run: |
          set -euo pipefail
          # Pure Swift + IOKit.hid, no Xcode project needed.
          # The runner is arm64, but this binary is for an x86_64 Hackintosh,
          # so cross-compile explicitly. Without -target the output is a
          # arm64 Mach-O (cputype 0x0100000C) and will not run there.
          swiftc -O \
            -target x86_64-apple-macos11.0 \
            -framework IOKit \
            -framework CoreFoundation \
            -o asus-kbd \
            AsusKbdHID.swift FnKeyMonitor.swift main.swift 2>&1 | tee build.log

      - name: Verify binary
        run: |
          set -euo pipefail
          test -f asus-kbd || { echo "binary not produced"; exit 1; }
          file asus-kbd
          lipo -info asus-kbd
          # Must be x86_64: the target machine is an x86_64 Hackintosh and
          # an arm64 Mach-O would simply not execute there.
          lipo -info asus-kbd | grep -q x86_64 \
            || { echo "binary is not x86_64"; exit 1; }
          if lipo -info asus-kbd | grep -q arm64; then
            echo "binary unexpectedly contains arm64"; exit 1
          fi
          # The protocol constants must be in the binary, otherwise the
          # compiler folded something away.
          for sym in AsusKbdHID FnKeyMonitor setBacklight illumination; do
            strings asus-kbd | grep -qi "$sym" \
              || { echo "MISSING: $sym"; exit 1; }
          done
          echo "verification OK"

      - name: Package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          [ -f asus-kbd ] && cp asus-kbd artifacts/ || true
          ls -l artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asus-kbd
          path: artifacts/*
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
